apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-ingress
  annotations:
    # Si usas NGINX, esta anotación es común
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: mi-app.local  # Puedes cambiarlo por tu dominio o IP
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-service
            port:
              number: 80