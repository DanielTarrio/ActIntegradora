apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-react-deployment
  labels:
    app: react-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
      - name: react-container
        image: danieltarrio/actividad-integradora:latest
        ports:
        - containerPort: 8888